  <style>
    .montra-page { background: var(--bg); padding-top: var(--header-height); min-height: 100vh; }
    .montra { max-width: 720px; margin: 0 auto; padding-bottom: 7rem; }
    .montra [hidden] { display: none !important; } /* .btn traz display próprio */
    .montra-estado { padding: 4rem 1.5rem; text-align: center; color: var(--text-muted); }
    .montra-estado i { display: block; font-size: 2.5rem; margin-bottom: .75rem; color: var(--brand-strong); }
    .montra-estado h1 { font-size: var(--text-xl); color: var(--text); margin-bottom: .5rem; }

    .montra-capa { height: 200px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; color: var(--brand-strong); font-size: 3.5rem; overflow: hidden; }
    .montra-capa img { width: 100%; height: 100%; object-fit: cover; }
    .montra-corpo { padding: 0 1rem; display: grid; gap: 1rem; }
    .montra-id { display: flex; gap: .875rem; margin-top: -2.25rem; }
    .montra-logo { width: 88px; height: 88px; flex-shrink: 0; border-radius: 26px; border: 4px solid var(--bg); background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; font: 700 1.75rem 'Bricolage Grotesque', sans-serif; overflow: hidden; }
    .montra-logo img { width: 100%; height: 100%; object-fit: cover; }
    .montra-id > div:last-child { padding-top: 2.5rem; min-width: 0; }
    .montra-id h1 { font-size: var(--text-xl); color: var(--text); line-height: 1.2; overflow-wrap: anywhere; }
    .montra-id p { font-size: var(--text-sm); color: var(--brand-strong); font-weight: 600; }

    .montra-pills { display: flex; flex-wrap: wrap; gap: .5rem; }
    .montra-pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .7rem; border-radius: 50px; font-size: .8rem; font-weight: 700; background: var(--surface-sunken); color: var(--text-muted); }
    .montra-pill--selo { background: var(--accent-soft); color: var(--accent-text); }
    .montra-pill--aberto { background: var(--success-50); color: var(--success-700); }
    [data-theme="dark"] .montra-pill--aberto { background: var(--surface-sunken); color: var(--success-500); }

    .montra-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .montra-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .75rem .25rem; text-align: center; min-width: 0; }
    .montra-tile strong { display: block; color: var(--text); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .montra-tile small { color: var(--text-muted); font-size: .75rem; }

    .montra-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .montra-acoes .btn { min-height: 48px; justify-content: center; }
    .montra h2 { font-size: var(--text-md); color: var(--text); margin-top: .5rem; }
    .montra-sobre p { color: var(--text-muted); margin-top: .35rem; overflow-wrap: anywhere; }

    .montra-produtos { list-style: none; margin: 0; padding: 0; }
    .montra-produto { display: flex; align-items: center; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid var(--border); }
    .montra-foto { width: 64px; height: 64px; flex-shrink: 0; border-radius: 14px; object-fit: cover; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; color: var(--text-subtle); font-size: 1.5rem; }
    .montra-info { flex: 1; min-width: 0; }
    .montra-info strong { display: block; color: var(--text); overflow-wrap: anywhere; }
    .montra-info small { display: block; color: var(--text-muted); overflow-wrap: anywhere; }
    .montra-info small.poucos { color: var(--brand-strong); }
    .montra-info small.esgotado { color: var(--color-error, #D92D20); }
    .montra-stepper { display: flex; align-items: center; gap: .25rem; }
    .montra-stepper button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-sunken); color: var(--text); cursor: pointer; font-size: 1rem; }
    .montra-stepper button.mais { background: var(--brand); color: var(--brand-ink); }
    .montra-stepper button:disabled { background: var(--surface-sunken); color: var(--text-subtle); cursor: not-allowed; }
    .montra-stepper span { min-width: 1.5rem; text-align: center; font-weight: 700; color: var(--text); }
    .montra-mais { justify-self: center; min-height: 44px; }

    .montra-app { display: flex; align-items: center; gap: .75rem; padding: 1rem; border-radius: 16px; background: var(--brand-soft); color: var(--text); text-decoration: none; font-weight: 600; min-height: 44px; }
    .montra-app i { color: var(--brand-strong); font-size: 1.5rem; }

    .montra-barra { position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .montra-barra[hidden] { display: none; }
    .montra-barra button { display: flex; align-items: center; gap: .75rem; width: 100%; max-width: 688px; min-height: 56px; margin: 0 auto; padding: 0 1rem; border: 0; border-radius: 16px; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; }
    .montra-barra b { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: var(--brand-ink); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: .8rem; }
    .montra-barra span { flex: 1; text-align: left; }

    .montra-pill--nota { background: var(--surface-sunken); color: var(--text); }
    .montra-pill--nota i { color: var(--gold-500, #F59E0B); }
    .montra-caixa { padding: 1rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
    .montra-caixa strong { color: var(--text); }
    .montra-caixa p, .montra-caixa small { color: var(--text-muted); overflow-wrap: anywhere; }
    .montra-fornada { display: flex; gap: .75rem; align-items: center; border-color: var(--brand); background: var(--brand-soft); margin-top: .5rem; }
    .montra-fornada i { font-size: 1.75rem; color: var(--brand-strong); }
    .montra-carimbos { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .5rem; }
    .montra-carimbos span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; color: var(--brand-ink); font-size: .8rem; }
    .montra-carimbos span.cheio { background: var(--brand); border-color: var(--brand); }
    .montra-lista { display: grid; gap: .75rem; margin-top: .5rem; list-style: none; padding: 0; }
    .montra-estrelas { color: var(--gold-500, #F59E0B); white-space: nowrap; }
    .montra-av-topo { display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
    .montra-av-foto { width: 100%; max-height: 240px; object-fit: cover; border-radius: 12px; margin-top: .5rem; }
    .montra-resposta { margin-top: .5rem; padding: .625rem .75rem; border-radius: 10px; background: var(--surface-sunken); }

    .montra-check { position: fixed; inset: 0; z-index: calc(var(--z-modal) - 1); background: rgba(5, 13, 39, .55); display: flex; align-items: flex-end; justify-content: center; }
    .montra-check__caixa { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom)); display: grid; gap: .875rem; color: var(--text); }
    @media (min-width: 640px) { .montra-check { align-items: center; } .montra-check__caixa { border-radius: 24px; } }
    .montra-check__topo { display: flex; align-items: center; gap: .75rem; }
    .montra-check__topo h2 { flex: 1; margin: 0; }
    .montra-check__topo button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface-sunken); color: var(--text); cursor: pointer; font-size: 1.1rem; }
    .montra-rotulo { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: .375rem; }
    .montra-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .montra-chips button { min-height: 44px; padding: 0 1rem; border-radius: 50px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
    .montra-chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    .montra-chips button:disabled { opacity: .55; cursor: not-allowed; }
    .montra-campo { width: 100%; min-height: 48px; padding: .625rem .875rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
    .montra-linha { display: flex; justify-content: space-between; gap: .75rem; color: var(--text-muted); }
    .montra-linha--total { color: var(--text); font-weight: 800; font-size: 1.05rem; padding-top: .5rem; border-top: 1px solid var(--border); }
    .montra-erro { padding: .625rem .75rem; border-radius: 10px; border: 1px solid var(--color-error, #D92D20); color: var(--text); }
    .montra-check .btn { width: 100%; min-height: 48px; justify-content: center; }
    .montra-passo { display: flex; gap: .5rem; align-items: center; color: var(--text-muted); }
    .montra-passo.feito { color: var(--text); font-weight: 700; }
    .montra-passo i { font-size: 1.25rem; }
    .montra-passo.feito i { color: var(--success-500); }
  </style>

<script>
(function () {
  'use strict';
  // Tudo o que vem do negócio entra por textContent: nunca como HTML.
  const $ = (id) => document.getElementById(id);
  const en = I18n.getCurrentLang() === 'en';
  const t = (pt, ing) => (en ? ing : pt);
  const PAGINA = 30;
  const CATEGORIAS = {
    restaurante: t('Restaurante', 'Restaurant'), padaria: t('Padaria', 'Bakery'), supermercado: t('Supermercado', 'Supermarket'),
    farmacia: t('Farmácia', 'Pharmacy'), boutique: 'Boutique', oficina: t('Oficina', 'Repair shop'), outro: t('Negócio', 'Business'),
  };
  const DIAS = t('domingo segunda terça quarta quinta sexta sábado', 'Sunday Monday Tuesday Wednesday Thursday Friday Saturday').split(' ');
  const DIAS_CURTOS = t('Dom Seg Ter Qua Qui Sex Sáb', 'Sun Mon Tue Wed Thu Fri Sat').split(' ');

  const kz = (v) => `${String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} Kz`;
  const minutos = (h) => Number(h.slice(0, 2)) * 60 + Number(h.slice(3, 5));
  const urlSegura = (u) => (typeof u === 'string' && u.startsWith('https://') ? u : '');
  const wa = (telefone, texto) => `https://wa.me/${telefone.replace(/\D/g, '')}?text=${encodeURIComponent(texto)}`;

  // Igual ao estadoAberto da app (features/negocios/model.ts).
  function estadoAberto(h, now = new Date()) {
    if (!h.dias.length) return { aberto: false, texto: t('Fechado', 'Closed') };
    const agora = now.getHours() * 60 + now.getMinutes();
    const abre = minutos(h.abre);
    const fecha = minutos(h.fecha);
    const hoje = now.getDay();
    const ontem = (hoje + 6) % 7;
    const passa = fecha <= abre;
    if ((h.dias.includes(hoje) && agora >= abre && (passa || agora < fecha)) || (passa && h.dias.includes(ontem) && agora < fecha)) {
      return { aberto: true, texto: t(`Aberto até ${h.fecha}`, `Open until ${h.fecha}`) };
    }
    if (h.dias.includes(hoje) && agora < abre) return { aberto: false, texto: t(`Fechado · abre às ${h.abre}`, `Closed · opens at ${h.abre}`) };
    for (let i = 1; i <= 7; i++) {
      const dia = (hoje + i) % 7;
      if (h.dias.includes(dia)) {
        return { aberto: false, texto: i === 1 ? t(`Fechado · abre amanhã às ${h.abre}`, `Closed · opens tomorrow at ${h.abre}`) : t(`Fechado · abre ${DIAS[dia]} às ${h.abre}`, `Closed · opens ${DIAS[dia]} at ${h.abre}`) };
      }
    }
    return { aberto: false, texto: t('Fechado', 'Closed') };
  }

  function stockTexto(stock) {
    if (stock === null) return t('Em stock', 'In stock');
    if (stock <= 0) return t('Esgotado', 'Sold out');
    return stock <= 10 ? t(`Restam ${stock}`, `${stock} left`) : t('Em stock', 'In stock');
  }

  function el(tag, attrs = {}, ...filhos) {
    const n = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else n.setAttribute(k, v);
    });
    n.append(...filhos);
    return n;
  }

  function mostrarEstado(icone, titulo, texto) {
    const box = $('mEstado');
    box.replaceChildren(el('i', { class: `ph ${icone}`, 'aria-hidden': 'true' }), ...(titulo ? [el('h1', { text: titulo })] : []), el('p', { text: texto }));
  }

  // Igual a features/negocios/model.ts da app.
  const minutosDe = (d) => d.getHours() * 60 + d.getMinutes();
  const horaDe = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const diaDe = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const horaValida = (h) => /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(h || '');
  const estadoNegocio = (n, now = new Date()) => (n.lojaFechada ? { aberto: false, texto: t('Fechado agora', 'Closed now') } : estadoAberto(n.horario, now));
  const codigoPedido = (id) => id.slice(-4).toUpperCase();
  const telefoneAO = (v) => {
    const d = String(v).replace(/\D/g, '').replace(/^(00)?244/, '');
    return /^9[0-9]{8}$/.test(d) ? `+244${d}` : '';
  };

  function fornadaAtiva(n, now = new Date()) {
    const f = n.fornada;
    if (!f || !horaValida(f.hora) || f.dia !== diaDe(now) || minutosDe(now) > minutos(f.hora) + 60) return null;
    return { ...f, quente: minutosDe(now) >= minutos(f.hora) };
  }

  const sobrasAtivas = (n, now = new Date()) =>
    (Array.isArray(n.sobras) ? n.sobras : []).filter((x) => x.dia === diaDe(now) && x.qtd > 0 && horaValida(x.ate) && minutosDe(now) < minutos(x.ate));

  function horasPedido(n, now = new Date()) {
    if (n.lojaFechada) return [];
    const agora = minutosDe(now);
    const abre = minutos(n.horario.abre);
    const fecha = minutos(n.horario.fecha) <= abre ? 24 * 60 : minutos(n.horario.fecha);
    const horas = [];
    if (n.horario.dias.includes(now.getDay())) {
      for (let m = Math.max(abre, Math.ceil((agora + 15) / 30) * 30); m < fecha && horas.length < 3; m += 30) horas.push(horaDe(m));
    }
    const f = fornadaAtiva(n, now);
    if (f && !f.quente && !horas.includes(f.hora)) horas.push(f.hora);
    horas.sort();
    return estadoNegocio(n, now).aberto ? ['agora', ...horas] : horas;
  }

  const MODOS = { levantar: t('Levantar', 'Pick up'), entrega: t('Entrega', 'Delivery'), mesa: t('Na mesa', 'At the table') };
  const pagamentoTexto = (p, modo) =>
    p === 'referencia'
      ? t('Pagamento por referência', 'Payment by reference')
      : { levantar: t('Dinheiro ao levantar', 'Cash on pick-up'), entrega: t('Dinheiro na entrega', 'Cash on delivery'), mesa: t('Dinheiro na mesa', 'Cash at the table') }[modo];

  const cesta = new Map();
  const redesenhos = [];
  // QR de mesa: o número segue na mensagem de WhatsApp.
  const mesa = (new URLSearchParams(location.search).get('mesa') ?? '').replace(/[^A-Za-z0-9 -]/g, '').slice(0, 10);
  let negocio = null;
  let negocioId = '';
  let produtos = [];
  let utilizador = null;
  let perfil = { nome: '', telefone: '' };
  let carimbos = 0;
  let pararPedido = null;
  // A mensagem de WhatsApp vai sempre em português: é o que o negócio lê.
  const ck = { modo: 'levantar', hora: '', morada: '', mesa: '', filial: '', telefone: '', pagamento: 'dinheiro', erro: '', busy: false, id: '', aguardaLogin: false };

  function linhasCesta() {
    return produtos.filter((p) => cesta.get(p.id)).map((p) => ({ produto: p, qtd: cesta.get(p.id) }));
  }

  function atualizarCesta() {
    const linhas = linhasCesta();
    const total = linhas.reduce((s, l) => s + l.produto.preco * l.qtd, 0);
    const itens = linhas.reduce((s, l) => s + l.qtd, 0);
    $('mBarra').hidden = !itens;
    $('mItens').textContent = itens;
    $('mTotal').textContent = kz(total);
  }

  function totais() {
    const subtotal = linhasCesta().reduce((s, l) => s + l.produto.preco * l.qtd, 0);
    const taxa = ck.modo === 'entrega' ? Number(negocio.taxaEntrega) || 0 : 0;
    const f = negocio.fidelidade;
    const desconto = f && f.meta > 0 && f.desconto > 0 && carimbos >= f.meta && subtotal >= f.desconto ? f.desconto : 0;
    return { subtotal, taxa, desconto, total: subtotal + taxa - desconto };
  }

  function mensagemWhatsapp() {
    const lista = linhasCesta().map((l) => `${l.qtd}× ${l.produto.nome} (${kz(l.produto.preco * l.qtd)})`).join('\n');
    const quando = ck.modo === 'mesa' ? `Mesa ${ck.mesa.trim()}` : `${{ levantar: 'Levantar', entrega: 'Entrega' }[ck.modo]} · ${ck.hora && ck.hora !== 'agora' ? ck.hora : 'agora'}`;
    const pagamento = ck.pagamento === 'referencia' ? 'Pagamento por referência' : { levantar: 'Dinheiro ao levantar', entrega: 'Dinheiro na entrega', mesa: 'Dinheiro na mesa' }[ck.modo];
    const extra = [quando, ck.modo !== 'entrega' && ck.filial ? `Filial: ${ck.filial}` : '', ck.modo === 'entrega' && ck.morada.trim() ? `Morada: ${ck.morada.trim()}` : '', pagamento].filter(Boolean).join('\n');
    return `Olá ${negocio.nome}! Quero fazer este pedido pela Conecta Já:\n\n${lista}\n\n${extra}\n\nTotal: ${kz(totais().total)}\n\nConfirma se está disponível, por favor.`;
  }

  const chips = (rotulo, opcoes, atual, escolher) =>
    el(
      'div',
      {},
      el('span', { class: 'montra-rotulo', text: rotulo }),
      el(
        'div',
        { class: 'montra-chips' },
        ...opcoes.map(([valor, texto, desligado]) => {
          const b = el('button', { type: 'button', text: texto, 'aria-pressed': String(valor === atual) });
          b.disabled = !!desligado;
          b.onclick = () => escolher(valor);
          return b;
        }),
      ),
    );

  function campo(rotulo, valor, guardar, attrs = {}) {
    const input = el('input', { class: 'montra-campo', 'aria-label': rotulo, ...attrs });
    input.value = valor;
    input.oninput = () => guardar(input.value);
    return el('label', {}, el('span', { class: 'montra-rotulo', text: rotulo }), input);
  }

  const linhaValor = (rotulo, valor, total) => el('div', { class: `montra-linha${total ? ' montra-linha--total' : ''}` }, el('span', { text: rotulo }), el('span', { text: valor }));

  function topoCheckout(titulo) {
    const fechar = el('button', { type: 'button', 'aria-label': t('Fechar', 'Close') }, el('i', { class: 'ph ph-x', 'aria-hidden': 'true' }));
    fechar.onclick = fecharCheckout;
    return el('div', { class: 'montra-check__topo' }, el('h2', { id: 'mCheckTitulo', text: titulo }), fechar);
  }

  function desenharCheckout() {
    const n = negocio;
    const horas = horasPedido(n);
    if (!horas.includes(ck.hora)) ck.hora = horas[0] ?? '';
    const aberto = estadoNegocio(n).aberto;
    const podePedir = ck.modo === 'mesa' ? aberto : !!ck.hora;
    const contas = totais();
    const opcoesModo = [['levantar', MODOS.levantar], ...(n.entrega ? [['entrega', MODOS.entrega]] : []), ...(n.mesas ? [['mesa', MODOS.mesa]] : [])];
    const filiais = Array.isArray(n.filiais) ? n.filiais : [];

    const confirmar = el('button', { type: 'button', class: 'btn btn--primary', text: utilizador ? t(`Confirmar pedido · ${kz(contas.total)}`, `Confirm order · ${kz(contas.total)}`) : t('Entrar para confirmar o pedido', 'Sign in to confirm the order') });
    confirmar.disabled = ck.busy || (!!utilizador && !podePedir);
    confirmar.onclick = confirmarPedido;
    const whatsapp = el('a', { class: 'btn btn--outline', href: wa(n.telefone, mensagemWhatsapp()), target: '_blank', rel: 'noopener' }, el('i', { class: 'ph-fill ph-whatsapp-logo', 'aria-hidden': 'true' }), t(' Enviar pedido por WhatsApp', ' Send order by WhatsApp'));

    $('mCheckCaixa').replaceChildren(
      topoCheckout(t('O teu pedido', 'Your order')),
      ...(aberto ? [] : [el('div', { class: 'montra-caixa' }, el('strong', { text: estadoNegocio(n).texto }), el('p', { text: horas.length ? t('Podes marcar para mais tarde.', 'You can book for later.') : t('Hoje já não dá para marcar aqui. Podes enviar o pedido por WhatsApp.', "It's too late to book here today. You can send the order by WhatsApp.") }))]),
      chips(t('Como queres?', 'How would you like it?'), opcoesModo, ck.modo, (v) => { ck.modo = v; desenharCheckout(); }),
      ...(filiais.length && ck.modo !== 'entrega' ? [chips(t('Em que loja?', 'Which shop?'), [['', t('Loja principal', 'Main shop')], ...filiais.map((f) => [f.nome, f.nome])], ck.filial, (v) => { ck.filial = v; desenharCheckout(); })] : []),
      ...(ck.modo === 'mesa'
        ? [campo(t('Número da mesa', 'Table number'), ck.mesa, (v) => { ck.mesa = v; }, { maxlength: '10' })]
        : horas.length
          ? [chips(ck.modo === 'entrega' ? t('Hora de entrega', 'Delivery time') : t('Hora de levantamento', 'Pick-up time'), horas.map((h) => [h, h === 'agora' ? t('Agora', 'Now') : h]), ck.hora, (v) => { ck.hora = v; desenharCheckout(); })]
          : []),
      ...(ck.modo === 'entrega' ? [campo(t('Morada de entrega', 'Delivery address'), ck.morada, (v) => { ck.morada = v; }, { maxlength: '160', autocomplete: 'street-address' })] : []),
      campo(t('O teu telefone', 'Your phone'), ck.telefone, (v) => { ck.telefone = v; }, { type: 'tel', maxlength: '16', placeholder: '9XX XXX XXX', autocomplete: 'tel' }),
      el('div', { class: 'montra-caixa' }, ...linhasCesta().map((l) => linhaValor(`${l.qtd}× ${l.produto.nome}`, kz(l.produto.preco * l.qtd)))),
      chips(t('Pagamento', 'Payment'), [['multicaixa', t('Multicaixa Express · Em breve', 'Multicaixa Express · Coming soon'), true], ...(n.dadosPagamento ? [['referencia', pagamentoTexto('referencia', ck.modo)]] : []), ['dinheiro', pagamentoTexto('dinheiro', ck.modo)]], ck.pagamento, (v) => { ck.pagamento = v; desenharCheckout(); }),
      el(
        'div',
        { style: 'display:grid;gap:.375rem' },
        linhaValor(t('Subtotal', 'Subtotal'), kz(contas.subtotal)),
        ...(ck.modo === 'entrega' ? [linhaValor(t('Taxa de entrega', 'Delivery fee'), contas.taxa ? kz(contas.taxa) : t('Combinar com o negócio', 'Arrange with the business'))] : []),
        ...(contas.desconto ? [linhaValor(t('Desconto de fidelidade', 'Loyalty discount'), `−${kz(contas.desconto)}`)] : []),
        linhaValor('Total', kz(contas.total), true),
      ),
      ...(ck.erro ? [el('div', { class: 'montra-erro', role: 'alert', text: ck.erro })] : []),
      confirmar,
      whatsapp,
    );
  }

  function abrirCheckout() {
    ck.erro = '';
    ck.id = ck.id || window.firebaseDb.collection('negocios').doc(negocioId).collection('pedidos').doc().id;
    $('mCheck').hidden = false;
    document.body.style.overflow = 'hidden';
    desenharCheckout();
  }

  function fecharCheckout() {
    $('mCheck').hidden = true;
    document.body.style.overflow = '';
    if (pararPedido) pararPedido();
    pararPedido = null;
  }

  async function confirmarPedido() {
    if (!utilizador) {
      // Fica nesta página depois de entrar, com a cesta intacta.
      ck.aguardaLogin = true;
      fecharCheckout();
      Modal.open('loginModal');
      return;
    }
    const clienteTelefone = telefoneAO(ck.telefone);
    const morada = ck.morada.trim();
    const mesaLimpa = ck.mesa.trim();
    const erro = !clienteTelefone
      ? t('O telefone tem de ser um número angolano de 9 dígitos, começado por 9.', 'The phone must be a 9-digit Angolan number starting with 9.')
      : ck.modo === 'entrega' && morada.length < 3
        ? t('Escreve a morada de entrega.', 'Enter the delivery address.')
        : ck.modo === 'mesa' && !mesaLimpa
          ? t('Escreve o número da mesa.', 'Enter the table number.')
          : !navigator.onLine
            ? t('Estás sem ligação. Liga os dados e tenta outra vez.', "You're offline. Turn on data and try again.")
            : '';
    ck.erro = erro;
    if (erro) return desenharCheckout();

    ck.busy = true;
    desenharCheckout();
    const agora = firebase.firestore.FieldValue.serverTimestamp();
    const ref = window.firebaseDb.collection('negocios').doc(negocioId).collection('pedidos').doc(ck.id);
    try {
      await ref.set({
        clienteUid: utilizador.uid,
        clienteNome: perfil.nome || utilizador.displayName || 'Cliente',
        clienteTelefone,
        modo: ck.modo,
        hora: ck.modo === 'mesa' ? 'agora' : ck.hora,
        morada: ck.modo === 'entrega' ? morada : '',
        mesa: ck.modo === 'mesa' ? mesaLimpa : '',
        filial: ck.modo === 'entrega' ? '' : ck.filial,
        pagamento: ck.pagamento,
        itens: linhasCesta().map((l) => ({ produtoId: l.produto.id, nome: l.produto.nome, preco: l.produto.preco, qtd: l.qtd })),
        ...totais(),
        negocioId,
        negocioNome: negocio.nome,
        dadosPagamento: ck.pagamento === 'referencia' ? negocio.dadosPagamento : '',
        pago: false,
        estado: 'novo',
        dia: diaDe(),
        source: 'site',
        createdAt: agora,
        updatedAt: agora,
      });
    } catch (e) {
      ck.busy = false;
      ck.erro = e.code === 'permission-denied' ? t('Este negócio não aceita pedidos agora. Podes enviar por WhatsApp.', "This business isn't taking orders now. You can send by WhatsApp.") : t('Não foi possível enviar o pedido. Tenta outra vez.', "We couldn't send the order. Try again.");
      return desenharCheckout();
    }
    const id = ck.id;
    ck.busy = false;
    ck.id = '';
    cesta.clear();
    redesenhos.forEach((d) => d());
    acompanharPedido(id);
  }

  // Do navegador não dá para enviar avisos ao telemóvel do negócio: por isso o botão de WhatsApp fica em destaque.
  function acompanharPedido(id) {
    const ref = window.firebaseDb.collection('negocios').doc(negocioId).collection('pedidos').doc(id);
    const codigo = codigoPedido(id);
    const PASSOS = [['novo', t('Novo', 'New')], ['preparo', t('Em preparo', 'Being prepared')], ['pronto', t('Pronto', 'Ready')], ['entregue', t('Entregue', 'Delivered')]];
    pararPedido = ref.onSnapshot((s) => {
      const p = s.data();
      if (!p) return;
      const atual = PASSOS.findIndex(([e]) => e === p.estado);
      const avisar = el('a', { class: 'btn btn--primary', href: wa(negocio.telefone, `Olá ${negocio.nome}! Fiz o pedido #${codigo} pela Conecta Já. Podem confirmar, por favor?`), target: '_blank', rel: 'noopener' }, el('i', { class: 'ph-fill ph-whatsapp-logo', 'aria-hidden': 'true' }), t(' Avisar o negócio por WhatsApp', ' Tell the business on WhatsApp'));
      const cancelar = el('button', { type: 'button', class: 'btn btn--ghost', text: t('Cancelar pedido', 'Cancel order') });
      cancelar.onclick = () => ref.update({ estado: 'cancelado', updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
      $('mCheckCaixa').replaceChildren(
        topoCheckout(t(`Pedido #${codigo}`, `Order #${codigo}`)),
        ...(p.estado === 'cancelado'
          ? [el('div', { class: 'montra-caixa' }, el('strong', { text: t('Pedido cancelado', 'Order cancelled') }))]
          : [el('div', { style: 'display:grid;gap:.5rem', role: 'status' }, ...PASSOS.map(([, texto], i) => el('div', { class: `montra-passo${i <= atual ? ' feito' : ''}` }, el('i', { class: i <= atual ? 'ph-fill ph-check-circle' : 'ph ph-clock', 'aria-hidden': 'true' }), texto)))]),
        ...(p.pagamento === 'referencia' && !p.pago && p.estado !== 'cancelado' ? [el('div', { class: 'montra-caixa' }, el('strong', { text: t('Como pagar', 'How to pay') }), el('p', { text: t(`Paga ${kz(p.total)} para ${p.dadosPagamento} e indica a referência CJ-${codigo}. O negócio confirma quando receber.`, `Pay ${kz(p.total)} to ${p.dadosPagamento} and quote reference CJ-${codigo}. The business confirms when it receives it.`) }))] : []),
        linhaValor('Total', kz(p.total), true),
        ...(p.estado === 'novo' ? [avisar, cancelar] : []),
      );
    });
  }

  function mostrarCartao() {
    const f = negocio.fidelidade;
    if (!f || !(f.meta > 0) || !(f.desconto > 0)) return;
    const cheios = Math.min(carimbos, f.meta);
    const faltam = f.meta - carimbos;
    const texto = faltam <= 0 ? t(`Tens ${kz(f.desconto)} de desconto no próximo pedido`, `You have ${kz(f.desconto)} off your next order`) : t(`${faltam === 1 ? 'Falta 1 compra' : `Faltam ${faltam} compras`} para ${kz(f.desconto)} de desconto`, `${faltam} more ${faltam === 1 ? 'purchase' : 'purchases'} for ${kz(f.desconto)} off`);
    $('mCartao').replaceChildren(
      el('strong', { text: t(`Cartão de carimbos · ${cheios} de ${f.meta}`, `Stamp card · ${cheios} of ${f.meta}`) }),
      el('p', { text: texto }),
      el('div', { class: 'montra-carimbos', 'aria-hidden': 'true' }, ...Array.from({ length: f.meta }, (_, i) => el('span', { class: i < cheios ? 'cheio' : '' }, ...(i < cheios ? [el('i', { class: 'ph-fill ph-check' })] : [])))),
    );
    $('mCartao').hidden = false;
  }

  // Ao entrar: nome, telefone e carimbos desta pessoa; e volta ao pedido, se foi isso que a levou a entrar.
  function aoMudarSessao(user) {
    utilizador = user;
    carimbos = 0;
    if (user && negocio) {
      window.firebaseDb.collection('providers').doc(user.uid).get().then((d) => {
        const p = d.data() ?? {};
        perfil = { nome: p.name ?? '', telefone: p.phone ?? '' };
        if (!ck.telefone && perfil.telefone) ck.telefone = perfil.telefone;
        if (!$('mCheck').hidden && !pararPedido) desenharCheckout();
      }).catch(() => {});
      window.firebaseDb.collection('negocios').doc(negocioId).collection('cartoes').doc(user.uid).get().then((d) => {
        carimbos = Number(d.data()?.carimbos ?? 0);
        mostrarCartao();
        if (!$('mCheck').hidden && !pararPedido) desenharCheckout();
      }).catch(() => {});
    }
    if (negocio) mostrarCartao();
    if (user && ck.aguardaLogin) {
      ck.aguardaLogin = false;
      abrirCheckout();
    } else if (!$('mCheck').hidden && !pararPedido) {
      desenharCheckout();
    }
  }

  async function carregarAvaliacoes(ref) {
    try {
      const s = await ref.collection('avaliacoes').orderBy('createdAt', 'desc').limit(10).get();
      if (s.empty) return;
      $('mListaAvaliacoes').replaceChildren(
        ...s.docs.map((d) => {
          const a = d.data();
          const nota = Math.min(5, Math.max(1, Number(a.nota) || 1));
          return el(
            'li',
            { class: 'montra-caixa' },
            el('div', { class: 'montra-av-topo' }, el('strong', { text: a.clienteNome || t('Cliente', 'Customer') }), el('span', { class: 'montra-estrelas', 'aria-label': t(`${nota} em 5`, `${nota} out of 5`), text: '★'.repeat(nota) + '☆'.repeat(5 - nota) })),
            ...(a.texto ? [el('p', { text: a.texto })] : []),
            ...(urlSegura(a.fotoUrl) ? [el('img', { class: 'montra-av-foto', src: a.fotoUrl, alt: '', loading: 'lazy' })] : []),
            ...(a.resposta ? [el('div', { class: 'montra-resposta' }, el('small', { text: t(`Resposta de ${negocio.nome}`, `Reply from ${negocio.nome}`) }), el('p', { text: a.resposta }))] : []),
          );
        }),
      );
      $('mAvaliacoes').hidden = false;
    } catch {
      // As avaliações são um extra: sem elas, o resto da Montra continua a funcionar.
    }
  }

  function linhaProduto(p) {
    const qtd = el('span', { text: '0', hidden: 'hidden', 'aria-live': 'polite' });
    const menos = el('button', { type: 'button', hidden: 'hidden', 'aria-label': t(`Tirar ${p.nome}`, `Remove ${p.nome}`) }, el('i', { class: 'ph ph-minus', 'aria-hidden': 'true' }));
    const mais = el('button', { type: 'button', class: 'mais', 'aria-label': t(`Adicionar ${p.nome}`, `Add ${p.nome}`) }, el('i', { class: 'ph ph-plus', 'aria-hidden': 'true' }));
    const limite = p.stock ?? 99;
    const desenhar = () => {
      const n = cesta.get(p.id) ?? 0;
      qtd.textContent = n;
      qtd.hidden = menos.hidden = !n;
      mais.disabled = n >= limite;
      atualizarCesta();
    };
    redesenhos.push(desenhar);
    const alterar = (d) => {
      cesta.set(p.id, Math.max(0, Math.min(limite, (cesta.get(p.id) ?? 0) + d)));
      desenhar();
    };
    menos.onclick = () => alterar(-1);
    mais.onclick = () => alterar(1);
    mais.disabled = limite <= 0;

    const foto = urlSegura(p.fotoUrl)
      ? el('img', { class: 'montra-foto', src: p.fotoUrl, alt: '', loading: 'lazy', width: '64', height: '64' })
      : el('div', { class: 'montra-foto' }, el('i', { class: 'ph ph-package', 'aria-hidden': 'true' }));
    const classeStock = p.stock !== null && p.stock <= 0 ? 'esgotado' : p.stock !== null && p.stock <= 10 ? 'poucos' : '';
    return el(
      'li',
      { class: 'montra-produto' },
      foto,
      el(
        'div',
        { class: 'montra-info' },
        el('strong', { text: p.nome }),
        ...(p.descricao ? [el('small', { text: p.descricao })] : []),
        el('small', { class: classeStock, text: stockTexto(p.stock) }),
        el('strong', { text: kz(p.preco) }),
      ),
      el('div', { class: 'montra-stepper' }, menos, qtd, mais),
    );
  }

  function juntarProdutos(pagina) {
    const visiveis = pagina.filter((p) => p.ativo !== false);
    produtos = produtos.concat(visiveis);
    $('mProdutos').append(...visiveis.map(linhaProduto));
    $('mSemProdutos').hidden = produtos.length > 0;
  }

  function mostrarNegocio(n) {
    negocio = n;
    document.title = `${n.nome} — Conecta Já`;
    const estado = estadoNegocio(n);
    const municipio = window.AOLocations.municipalityLabel(n.province, n.municipality);
    const provincia = window.AOLocations.provinceLabel(n.province);
    const horas = `${n.horario.abre}–${n.horario.fecha}`;

    if (urlSegura(n.capaUrl)) $('mCapa').replaceChildren(el('img', { src: n.capaUrl, alt: '' }));
    if (urlSegura(n.logoUrl)) $('mLogo').replaceChildren(el('img', { src: n.logoUrl, alt: '' }));
    else $('mLogo').textContent = n.nome.split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
    $('mNome').textContent = n.nome;
    const tipo = (n.categoria === 'outro' && n.tipoOutro) || (CATEGORIAS[n.categoria] ?? CATEGORIAS.outro);
    $('mSub').textContent = [tipo, municipio].filter(Boolean).join(' · ');

    $('mPills').replaceChildren(
      ...(n.verificado ? [el('span', { class: 'montra-pill montra-pill--selo' }, el('i', { class: 'ph-fill ph-seal-check', 'aria-hidden': 'true' }), t('Empresa Verificada', 'Verified Business'))] : []),
      ...(n.notaTotal > 0 ? [el('span', { class: 'montra-pill montra-pill--nota' }, el('i', { class: 'ph-fill ph-star', 'aria-hidden': 'true' }), `${(Math.round((n.notaSoma / n.notaTotal) * 10) / 10).toFixed(1).replace('.', ',')} (${n.notaTotal})`)] : []),
      el('span', { class: `montra-pill${estado.aberto ? ' montra-pill--aberto' : ''}`, text: estado.texto }),
    );

    const fornada = fornadaAtiva(n);
    const sobras = sobrasAtivas(n).map((x) => ({ id: `sobra:${x.id}`, nome: x.nome, descricao: t(`Sobra do dia · até ${x.ate}`, `Today's leftover · until ${x.ate}`), preco: x.preco, stock: x.qtd, fotoUrl: '', ativo: true }));
    if (fornada) {
      $('mFornada').replaceChildren(el('i', { class: 'ph-fill ph-fire', 'aria-hidden': 'true' }), el('div', {}, el('strong', { text: t(`Fornada quente às ${fornada.hora}`, `Hot batch at ${fornada.hora}`) }), ...(fornada.texto ? [el('p', { text: fornada.texto })] : [])));
      $('mFornada').hidden = false;
    }
    if (sobras.length) {
      produtos = produtos.concat(sobras);
      $('mSobras').append(...sobras.map(linhaProduto));
    }
    $('mOfertas').hidden = !fornada && !sobras.length;

    const filiais = Array.isArray(n.filiais) ? n.filiais : [];
    if (filiais.length) {
      $('mFiliais').replaceChildren(
        el('h2', { text: t('Filiais', 'Branches') }),
        ...filiais.map((f) => el('p', {}, el('strong', { text: f.nome }), ` · ${[f.neighborhood, window.AOLocations.municipalityLabel(f.province, f.municipality)].filter(Boolean).join(', ')}`)),
      );
    }
    if (mesa && n.mesas) {
      ck.modo = 'mesa';
      ck.mesa = mesa;
    }
    mostrarCartao();

    const tile = (valor, rotulo) => el('div', { class: 'montra-tile' }, el('strong', { text: valor }), el('small', { text: rotulo }));
    $('mTiles').replaceChildren(
      tile(municipio || provincia || '—', t('Zona', 'Area')),
      tile(horas, t('Horário', 'Hours')),
      tile(n.entrega ? n.tempoEntrega || t('Sim', 'Yes') : t('Não', 'No'), t('Entrega', 'Delivery')),
    );

    $('mPedir').href = wa(n.telefone, `Olá ${n.nome}! Vi a vossa Montra na Conecta Já e gostava de fazer um pedido.`);
    $('mLigar').href = `tel:${n.telefone}`;
    $('mSemProdutos').textContent = t('O catálogo ainda está a ser preparado. Podes fazer o teu pedido por WhatsApp.', 'The catalogue is still being prepared. You can order by WhatsApp.');
    $('mDescricao').textContent = n.descricao || '';
    $('mHorario').textContent = `${n.horario.dias.map((d) => DIAS_CURTOS[d]).join(', ')} · ${horas}`;
    $('mMorada').textContent = [n.neighborhood, municipio, provincia].filter(Boolean).join(', ');

    $('mEstado').hidden = true;
    $('mConteudo').hidden = false;
  }

  const indisponivel = () =>
    mostrarEstado('ph-storefront', t('Montra indisponível', 'Storefront unavailable'), t('Este negócio já não está na Conecta Já ou ainda está à espera de aprovação.', 'This business is no longer on Conecta Já or is still awaiting approval.'));

  (async function iniciar() {
    const id = new URLSearchParams(location.search).get('id') ?? '';
    if (!/^[A-Za-z0-9_-]{6,64}$/.test(id)) return indisponivel();
    mostrarEstado('ph-hourglass', '', t('A carregar a Montra…', 'Loading the Storefront…'));

    const ref = window.firebaseDb.collection('negocios').doc(id);
    let doc;
    try {
      doc = await ref.get();
    } catch (e) {
      // As regras escondem negócios não aprovados: para o público é o mesmo que não existir.
      if (e.code === 'permission-denied') return indisponivel();
      return mostrarEstado('ph-wifi-slash', t('Sem ligação', 'No connection'), t('Não conseguimos abrir esta Montra.', "We couldn't open this Storefront."));
    }
    if (!doc.exists) return indisponivel();
    negocioId = id;
    mostrarNegocio(doc.data());
    $('mVerCesta').onclick = abrirCheckout;
    $('mCheck').onclick = (e) => { if (e.target === $('mCheck')) fecharCheckout(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('mCheck').hidden) fecharCheckout(); });
    window.ficarAposEntrar = true;
    window.firebaseAuth.onAuthStateChanged(aoMudarSessao);
    carregarAvaliacoes(ref);

    let cursor = null;
    async function carregar() {
      $('mMais').hidden = true;
      try {
        let q = ref.collection('produtos').orderBy('ordem').limit(PAGINA);
        if (cursor) q = q.startAfter(cursor);
        const s = await q.get();
        cursor = s.docs[s.docs.length - 1] ?? cursor;
        juntarProdutos(s.docs.map((d) => ({ id: d.id, ...d.data() })));
        $('mMais').hidden = s.docs.length < PAGINA;
      } catch {
        $('mSemProdutos').textContent = t('Não conseguimos carregar o catálogo. Verifica a ligação.', "We couldn't load the catalogue. Check your connection.");
        $('mSemProdutos').hidden = false;
      }
    }
    $('mMais').onclick = carregar;
    carregar();
  })();
})();
</script>
</body>
</html>
