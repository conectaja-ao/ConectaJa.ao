<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Sem Ligação — Conecta Já</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Página isolada (servida offline sem tokens.css): valores copiados dos tokens */
      --color-primary: #FD6802;
      --color-secondary: #F4A261;
      --color-accent: #2A9D8F;
      --gradient-primary: linear-gradient(135deg, #FD6802 0%, #FE9667 100%);
    }
    body {
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #100E0C 0%, #1B1815 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: white; text-align: center; padding: 2rem;
    }
    .offline-wrap { max-width: 560px; margin: 0 auto; }
    .offline-logo {
      display: inline-flex; align-items: center; gap: .75rem;
      font-size: 1.5rem; font-weight: 900; color: white; text-decoration: none;
      margin-bottom: 3rem;
    }
    .offline-logo svg { width: 36px; height: 36px; color: var(--color-primary); }
    .offline-logo span { color: var(--color-primary); }
    .offline-icon {
      width: 120px; height: 120px; border-radius: 2rem; margin: 0 auto 2.5rem;
      background: var(--gradient-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; color: white;
      box-shadow: 0 20px 60px rgba(253, 104, 2,.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 20px 60px rgba(253, 104, 2,.3); }
      50% { box-shadow: 0 20px 80px rgba(253, 104, 2,.5), 0 0 0 20px rgba(253, 104, 2,.1); }
    }
    h1 { font-size: clamp(2rem,5vw,3rem); font-weight: 900; margin-bottom: 1rem; }
    h1 span { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    p { font-size: 1.1rem; color: rgba(255,255,255,.65); line-height: 1.7; margin-bottom: 2.5rem; }
    .btn-retry {
      display: inline-flex; align-items: center; gap: .75rem;
      padding: 1rem 2.5rem; border-radius: 1rem;
      background: var(--gradient-primary);
      color: white; font-size: 1rem; font-weight: 700; border: none;
      cursor: pointer; text-decoration: none;
      transition: all .3s; box-shadow: 0 8px 30px rgba(253, 104, 2,.3);
    }
    .btn-retry:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(253, 104, 2,.4); }
    .offline-tips { margin-top: 3rem; display: flex; flex-direction: column; gap: .75rem; }
    .tip { display: flex; align-items: center; gap: .75rem; padding: 1rem 1.25rem; border-radius: 1rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); text-align: left; font-size: .9rem; color: rgba(255,255,255,.6); }
    .tip i { color: var(--color-secondary); flex-shrink: 0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); display: inline-block; margin-right: .5rem; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .connection-status { font-size: .875rem; color: rgba(255,255,255,.4); margin-top: 2rem; }
  </style>
  <script>!function(){var t=localStorage.getItem('cj-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FD6802">
</head>
<body>
  <div class="offline-wrap">
    <a href="index.html" class="offline-logo">
      <svg viewBox="0 0 40 40" fill="none"><path d="M20 0L40 10V30L20 40L0 30V10L20 0Z" fill="currentColor"/><circle cx="20" cy="20" r="8" fill="white"/></svg>
      Conecta<span>Já</span>
    </a>

    <div class="offline-icon"><i class="ph ph-wifi-high"></i></div>

    <h1>Sem <span>Ligação</span></h1>
    <p>Parece que perdeste a ligação à internet. Verifica a tua rede Wi-Fi ou dados móveis e tenta novamente.</p>

    <button class="btn-retry" onclick="window.location.reload()">
      <i class="ph ph-arrow-clockwise"></i> Tentar Novamente
    </button>

    <div class="offline-tips">
      <div class="tip"><i class="ph ph-wifi-high"></i> Verifica se estás ligado ao Wi-Fi</div>
      <div class="tip"><i class="ph ph-device-mobile"></i> Activa os dados móveis se estiveres fora de casa</div>
      <div class="tip"><i class="ph ph-wifi-high"></i> Reinicia o router se o problema persistir</div>
    </div>

    <p class="connection-status">
      <span class="status-dot"></span> A verificar ligação…
    </p>
  </div>

  <script>
    // Auto-refresh when back online
    window.addEventListener('online', () => {
      document.querySelector('.connection-status').innerHTML = '<span style="color:#25D366;">● Ligação restaurada! A redirecionar…</span>';
      setTimeout(() => window.location.href = 'index.html', 1500);
    });

    // Update status text
    window.addEventListener('offline', () => {
      document.querySelector('.connection-status').innerHTML = '<span style="color:#FD6802;">● Sem ligação à internet</span>';
    });
  </script>
</body>
</html>
